name: Full-flight offscreen culling A/B
on:
  push:
    branches:
      - perf/cull-offscreen-entities
  workflow_dispatch:
jobs:
  full-flight-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare High-quality adventures with sprites drawn or culled
        env:
          LONG_MODE: high
          LONG_SECONDS: "130"
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          LONG_DRAW_ALL_ENTITIES=1 LONG_OUTPUT=test-results/offscreen-culling/native/draw-all npm run benchmark:long-flight
          LONG_DRAW_ALL_ENTITIES=0 LONG_OUTPUT=test-results/offscreen-culling/native/culled npm run benchmark:long-flight
          node scripts/compare-offscreen-culling-native.cjs
      - name: Keep native frame profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-flight-offscreen-culling-ab
          path: test-results/offscreen-culling/native/
          if-no-files-found: ignore
