name: Experimental forest pre-scale A/B
on:
  push:
    branches: [perf/forest-prescale-ab-20261104]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pixel difference, memory budget and paired raster times
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main >/tmp/prescale-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          node scripts/benchmark-prescale-audit.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: forest-prescale-audit
          path: test-results/prescale
          if-no-files-found: ignore
