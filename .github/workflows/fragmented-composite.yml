name: Fragmented forest composite A/B
on:
  push:
    branches: [perf/precompose-fragmented-backdrop]
  workflow_dispatch:
jobs:
  composite:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full-scene visual error thresholds and matched frame-time A/B
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          npm run test:background
          node scripts/benchmark-fragmented-composite.cjs
      - name: Persist metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fragmented-composite-metrics
          path: test-results/fragmented-composite
          if-no-files-found: ignore
