name: Full-flight resolution candidate benchmark
on:
  push:
    branches:
      - perf/auto-resolution-candidates
  workflow_dispatch:
jobs:
  resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        dpr: ["1.00", "1.15", "1.25", "1.35", "1.50", "1.70"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full-effects fixed quality flight with simulated DPR
        env:
          LONG_MODE: high
          LONG_DPR: ${{ matrix.dpr }}
          LONG_SECONDS: "140"
          LONG_OUTPUT: test-results/dpr-long/${{ matrix.dpr }}
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          npm run benchmark:long-flight
      - name: Keep per-stage frame timing for candidate evaluation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dpr-candidate-${{ matrix.dpr }}
          path: test-results/dpr-long/${{ matrix.dpr }}/
          if-no-files-found: ignore
