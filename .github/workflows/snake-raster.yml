name: Snake raster optimization A/B
on:
  push:
    branches:
      - perf/snake-mesh-source-window
  workflow_dispatch:
jobs:
  snake-raster:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exact pixel parity — all snake phases and two viewport sizes
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          npm run test:snake-raster-parity
          npm run benchmark:snake-a2
          npm run benchmark:render-parts
          npm run benchmark:background-passes
          PERF_ISOLATE=1 PERF_SECONDS=4 npm run benchmark:hotspots
