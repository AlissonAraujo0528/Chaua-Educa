name: Long real-time flight diagnostic
on:
  push:
    branches:
      - perf/diagnose-render-bottlenecks
jobs:
  flight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native real-time piloted adventure and frame intervals
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          LONG_SECONDS=90 npm run benchmark:long-flight
      - name: Keep long-flight metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaua-long-flight
          path: test-results/long-flight/
          if-no-files-found: ignore
