name: Long season-transition flight comparison
on:
  push:
    branches:
      - perf/quantized-transition-backdrop
  workflow_dispatch:
jobs:
  flight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [auto, high]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native 120s four-stage adventure, including transitions and encounters
        env:
          LONG_MODE: ${{ matrix.mode }}
          LONG_SECONDS: "120"
          LONG_OUTPUT: test-results/transition-composite/flight-${{ matrix.mode }}
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          npm run benchmark:long-flight
      - name: Retain frametimes by season, phase and graphics quality
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chaua-transition-flight-${{ matrix.mode }}
          path: test-results/transition-composite/flight-${{ matrix.mode }}/
          if-no-files-found: ignore
