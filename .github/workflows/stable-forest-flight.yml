name: High versus Auto full-flight stability
on:
  push:
    branches:
      - perf/cache-stable-forest-stages
  workflow_dispatch:
jobs:
  full-flight:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        mode: [auto, high]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native frame intervals across all 4 stages with encounters
        env:
          LONG_SECONDS: "120"
          LONG_MODE: ${{ matrix.mode }}
          LONG_OUTPUT: test-results/stable-stages/flight-${{ matrix.mode }}
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          npm run benchmark:long-flight
      - name: Preserve per-stage P95 and P99
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stable-flight-${{ matrix.mode }}
          path: test-results/stable-stages/flight-${{ matrix.mode }}/
          if-no-files-found: ignore
