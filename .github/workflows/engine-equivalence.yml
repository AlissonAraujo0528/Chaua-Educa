name: Physics equivalence and CPU A/B
on:
  push:
    branches: [perf/user-optimizations-validated-20261104]
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare exact pre-optimization engine to candidate
        run: |
          git show HEAD^:Chaua-Educa-main/js/engine.mjs > Chaua-Educa-main/js/engine-before-audit.mjs
          node scripts/compare-engine-equivalence.cjs
          rm Chaua-Educa-main/js/engine-before-audit.mjs
