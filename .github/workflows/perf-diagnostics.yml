name: Render performance diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - perf/diagnose-render-bottlenecks
jobs:
  hotspot-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure render hotspots
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          PERF_SECONDS=6 npm run benchmark:hotspots
          npm run benchmark:resolution
      - name: Save comparable visual captures and metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chaua-resolution-captures
          path: test-results/resolution/
          if-no-files-found: ignore
