name: Test forensic match branch
on:
  push:
    branches:
      - test/forense-causal-raf-v114-20261120
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check changed script syntax
        run: |
          node --check Chaua-Educa-main/js/match-performance.mjs
          node --check Chaua-Educa-main/js/perf-forensics.mjs
          node --check Chaua-Educa-main/js/render.mjs
          node --check Chaua-Educa-main/js/seasons.mjs
          node --check tests/browser-match-forensic-integration.cjs
      - run: npm test
      - run: npm run audit:release
      - run: npx playwright install --with-deps chromium
      - name: Verify browser export and visible warmup in the diagnostic branch
        run: |
          set -euo pipefail
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-forensic.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          node tests/browser-match-forensic-integration.cjs
