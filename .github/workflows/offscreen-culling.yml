name: Offscreen entity culling A/B
on:
  push:
    branches:
      - perf/cull-offscreen-entities
  workflow_dispatch:
jobs:
  culling:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pixel-exact offscreen sprites and warning overlays plus dense A/B
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          node scripts/benchmark-offscreen-culling.cjs
          node tests/browser-snake-continuity.cjs
          node tests/browser-snake-strike.cjs
      - name: Preserve exact-pixel comparison and frame times
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offscreen-entity-culling
          path: test-results/offscreen-culling/
          if-no-files-found: ignore
