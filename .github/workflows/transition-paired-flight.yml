name: Paired native flight transition A/B
on:
  push:
    branches:
      - perf/quantized-transition-backdrop
  workflow_dispatch:
jobs:
  flight-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Play identical High-quality seed with original and staged transitions
        env:
          LONG_MODE: high
          LONG_SECONDS: "130"
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          LONG_DISABLE_STAGING=1 LONG_OUTPUT=test-results/transition-composite/paired/direct npm run benchmark:long-flight
          LONG_DISABLE_STAGING=0 LONG_OUTPUT=test-results/transition-composite/paired/staged npm run benchmark:long-flight
          node scripts/compare-transition-flights.cjs
      - name: Retain side-by-side exact phase frametime profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transition-native-paired-ab
          path: test-results/transition-composite/paired/
          if-no-files-found: ignore
