name: Fragmented forest long-flight check
on:
  push:
    branches: [perf/precompose-fragmented-backdrop]
  workflow_dispatch:
jobs:
  long-flight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [auto, high]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native-time full journey with animated encounters
        env:
          LONG_MODE: ${{ matrix.mode }}
          LONG_SECONDS: "120"
          LONG_OUTPUT: test-results/fragmented-composite/flight-${{ matrix.mode }}
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          npm run benchmark:long-flight
      - name: Save stage-by-stage FPS and stutters
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fragmented-cache-long-${{ matrix.mode }}
          path: test-results/fragmented-composite/flight-${{ matrix.mode }}
          if-no-files-found: ignore
