name: Compare Auto and manual graphics in real-time flights
on:
  push:
    branches:
      - perf/auto-preserve-visuals
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [auto, high, low]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real-time 140s flight with same game seed and full encounters
        env:
          LONG_SECONDS: "140"
          LONG_MODE: ${{ matrix.mode }}
          LONG_OUTPUT: test-results/auto-comparison/${{ matrix.mode }}
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null' EXIT
          npm run benchmark:long-flight
      - name: Upload frametimes and stage-by-stage graphics comparisons
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: auto-comparison-${{ matrix.mode }}
          path: test-results/auto-comparison/${{ matrix.mode }}/
          if-no-files-found: ignore
