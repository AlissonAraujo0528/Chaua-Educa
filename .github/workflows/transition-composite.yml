name: Season transition composite A/B
on:
  push:
    branches:
      - perf/quantized-transition-backdrop
  workflow_dispatch:
jobs:
  transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare transition raster, P95/P99 and pixels against original
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          node scripts/benchmark-transition-composite.cjs
          node scripts/benchmark-transition-tiles.cjs
      - name: Preserve same-scene comparison images and measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chaua-season-transition-ab
          path: test-results/transition-composite/
          if-no-files-found: ignore
