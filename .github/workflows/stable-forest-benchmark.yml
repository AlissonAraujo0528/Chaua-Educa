name: Stable forest stage compositing A/B
on:
  push:
    branches:
      - perf/cache-stable-forest-stages
  workflow_dispatch:
jobs:
  stable-forest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare stages 0-3 and verify unchanged transitions
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          node scripts/benchmark-stable-forest-stages.cjs
      - name: Preserve comparison metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stable-forest-benchmark
          path: test-results/stable-stages/
          if-no-files-found: ignore
