name: Final pre-merge native long-flight A/B
on:
  push:
    branches: [perf/final-grafico-premerge-20261104]
  workflow_dispatch:
jobs:
  longflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare full flight with original graphics path and final candidate
        run: |
          python3 -m http.server 5501 --bind 127.0.0.1 --directory Chaua-Educa-main > /tmp/chaua-final-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null' EXIT
          LONG_MODE=high LONG_SECONDS=140 LONG_NO_STRIPE_SYNC=1 LONG_KEEP_OPAQUE_SKY=1 LONG_KEEP_OPAQUE_LIGHTKEY=1 LONG_OUTPUT=test-results/final-premerge/baseline npm run benchmark:long-flight
          LONG_MODE=high LONG_SECONDS=140 LONG_OUTPUT=test-results/final-premerge/candidate npm run benchmark:long-flight
          node scripts/compare-final-long.cjs
      - name: Save exact full-flight comparisons
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: final-premerge-native-flight
          path: test-results/final-premerge
          if-no-files-found: ignore
